[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "otune-engine"
version = "2.0.0"
description = "Apple Music-style automated DJ mixing engine optimized for Apple Silicon"
requires-python = ">=3.10"
dependencies = [
    "librosa>=0.10.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "soundfile>=0.12.0",
    "pyloudnorm>=0.1.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gpu = ["torch>=1.12.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
